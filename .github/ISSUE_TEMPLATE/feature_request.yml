name: Feature request
description: Suggest a command, view, or setting for the extension.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your workflow in the editor, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Where would it live - a command, a view, a status bar item, a setting?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - Commands and keybindings
        - Sidebar views / tree
        - Report webview
        - Status bar
        - Settings and configuration
        - Editor decorations
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This belongs in the extension, not in the howmany CLI itself.
          required: true
