version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    ignore:
      # @types/vscode is the engine floor declared in package.json, not a
      # dependency to track upward. Raising it drops support for older editors,
      # so it stays a deliberate manual decision.
      - dependency-name: "@types/vscode"
      # @types/node describes the Node that VS Code bundles at the engines.vscode
      # floor, not the newest Node on npm. Its major moves only when that floor
      # moves; patches within the major are still welcome.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native port and ships no programmatic compiler API
      # until 7.1, so typescript-eslint's peer range (<6.1.0) rejects it and the
      # install fails outright. Lift this once 7.1 restores the API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
